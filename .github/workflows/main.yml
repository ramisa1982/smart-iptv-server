name: Update Channels Daily

on:
  schedule:
    - cron: '0 0 * * *' # منتصف الليل
  workflow_dispatch:     # زر تشغيل يدوي

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # إذن إجباري للكتابة

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install libraries
        run: pip install requests google-generativeai

      - name: Run AI Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      # --- الحل الجذري هنا ---
      # نستخدم أوامر Git يدوية بدلاً من الأدوات الجاهزة
      - name: Force Update Playlist
        run: |
          # 1. تعريف المستخدم الوهمي
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 2. إضافة الملف الناتج
          git add playlist_active.m3u
          
          # 3. محاولة الحفظ (إذا لم تتغير القنوات لن يفعل شيئاً)
          # المقطع "|| echo" يمنع توقف السكربت إذا لم يوجد تغيير
          git commit -m "Auto-update playlist via AI" || echo "No changes to commit"
          
          # 4. الخطوة السحرية: سحب التحديثات من الموقع ودمجها بالقوة
          # هذا يحل مشكلة (rejected non-fast-forward) نهائياً
          git pull origin main --rebase
          
          # 5. الرفع النهائي
          git push origin main
