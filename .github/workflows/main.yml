name: Update Channels Daily

on:
  schedule:
    - cron: '0 0 * * *'  # يعمل كل يوم منتصف الليل
  workflow_dispatch:      # يسمح لك بتشغيله يدوياً بزر

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # إذن للكتابة في المستودع

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run AI Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Updated Channel List via AI"
          file_pattern: "playlist_active.m3u"
