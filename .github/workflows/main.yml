name: Update Channels Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main  # إجبار الروبوت على استخدام الفرع الرئيسي
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install libraries
        run: pip install requests google-generativeai

      - name: Run AI Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      # --- الحل النهائي لمشاكل التزامن ---
      - name: Commit and Push Safely
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 1. التأكد أننا على الفرع الرئيسي ولسنا في حالة منفصلة
          git checkout main
          
          # 2. سحب آخر التحديثات قبل إضافة الملف
          git pull origin main
          
          # 3. إضافة الملف المولد
          git add playlist_active.m3u
          
          # 4. الحفظ
          git commit -m "Auto-update playlist via AI" || echo "No changes to commit"
          
          # 5. سحب أخير مع دمج (Rebase) لضمان عدم وجود تضارب
          git pull origin main --rebase
          
          # 6. الرفع النهائي
          git push origin main
