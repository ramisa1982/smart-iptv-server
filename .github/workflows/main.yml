name: Update Channels Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install libraries
        run: pip install requests google-generativeai

      - name: Run AI Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      # --- الحل السحري (الخزنة المؤقتة) ---
      - name: Push Result Safely
        run: |
          # 1. إعداد هوية البوت
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # 2. نخبئ الملف الناتج في مكان آمن خارج مجلد Git
          cp playlist_active.m3u /tmp/playlist_active.m3u
          
          # 3. نجبر النظام على التطابق مع الموقع تماماً (إلغاء أي تضارب)
          git fetch origin main
          git reset --hard origin/main
          
          # 4. نسترجع الملف من الخزنة
          cp /tmp/playlist_active.m3u playlist_active.m3u
          
          # 5. الحفظ والرفع (الآن الطريق ممهد 100%)
          git add playlist_active.m3u
          git commit -m "Daily AI Update" || echo "No changes to commit"
          git push origin main
